body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #ffffff;
  font-family: 'Montserrat', sans-serif;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 360px;
  background: #ffffff;
  border: 1px solid #e0e0e0;
  border-radius: 2px;
  padding: 48px 36px 40px;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.8s ease both;
  text-align: center;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #b48c50, transparent);
}

.card::after {
  content: '';
  position: absolute;
  bottom: -60px; right: -60px;
  width: 160px; height: 160px;
  border-radius: 50%;
  border: 1px solid rgba(180, 140, 80, 0.08);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.monogram {
  width: 56px;
  height: 56px;
  border: 1px solid #b48c50;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 28px;
  animation: fadeUp 0.8s 0.1s ease both;
}

.monogram span {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 600;
  color: #b48c50;
  letter-spacing: 1px;
}

.name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 40px;
  font-weight: 600;
  color: #1a1a1a;
  letter-spacing: 1px;
  line-height: 1.1;
  margin-bottom: 6px;
  animation: fadeUp 0.8s 0.15s ease both;
}

.divider {
  width: 32px;
  height: 1px;
  background: #b48c50;
  margin: 18px auto 24px;
  animation: fadeUp 0.8s 0.2s ease both;
}

.contact-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.contact-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  animation: fadeUp 0.8s ease both;
}

.contact-item:nth-child(1) { animation-delay: 0.25s; }
.contact-item:nth-child(2) { animation-delay: 0.32s; }
.contact-item:nth-child(3) { animation-delay: 0.39s; }

.icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 2px;
  opacity: 0.5;
  fill: #b48c50;
}

.contact-text {
  font-size: 16px;
  font-weight: 500;
  color: #555555;
  letter-spacing: 0.5px;
  line-height: 1.5;
  text-decoration: none;
  transition: color 0.2s;
}

a.contact-text:hover { color: #b48c50; }

.save-btn {
  display: block;
  width: 100%;
  margin-top: 36px;
  padding: 14px;
  background: transparent;
  border: 1px solid #e0e0e0;
  border-radius: 1px;
  color: #b48c50;
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  animation: fadeUp 0.8s 0.45s ease both;
  text-decoration: none;
  text-align: center;
}

.save-btn:hover {
  background: rgba(180, 140, 80, 0.06);
  border-color: #b48c50;
}
